# ============================================================
# newapi-logger docker-compose.yml
# 独立编排，不影响原有 docker-compose
#
# 使用方法:
#   docker compose up -d       # 启动
#   docker compose down        # 停止（原服务不受影响）
#   docker compose restart     # 重启
#   docker compose logs -f     # 查看实时日志
#   docker compose ps          # 查看运行状态
#
# 端口分配:
#   api-logger : 8100  (内部代理端口，不对外暴露)
#   newapi     : 55000 (对外 API 端口，由 nginx 接入)
#   多 vllm    : 55001/55002/55003
#   bge/rerank : 55006
#   通义       : 54001
# ============================================================
version: "3.8"

services:
  api-logger:
    build:
      context: ./api-logger
      dockerfile: Dockerfile
    image: api-logger:latest
    container_name: api-logger
    restart: unless-stopped

    ports:
      - "${LISTEN_PORT:-8100}:8100"

    environment:
      # === 必填 ===
      - NEWAPI_URL=${NEWAPI_URL:-http://newapi:55000}
      - NEWAPI_HOST=${NEWAPI_HOST:-newapi}
      - NEWAPI_PORT=${NEWAPI_PORT:-55000}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-newapi_logs}

      # === 可选 ===
      - LISTEN_HOST=${LISTEN_HOST:-0.0.0.0}
      - LISTEN_PORT=8100
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - FULL_LOG_MAX_MB=${FULL_LOG_MAX_MB:-100}
      - ERROR_LOG_MAX_MB=${ERROR_LOG_MAX_MB:-50}
      - TOKEN_MASK=${TOKEN_MASK:-false}

      # === 连接池 ===
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-2}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-8}
      - DB_WORKER_THREADS=${DB_WORKER_THREADS:-3}
      - DB_QUEUE_MAXSIZE=${DB_QUEUE_MAXSIZE:-10000}

      # === HTTP ===
      - HTTP_MAX_CONNECTIONS=${HTTP_MAX_CONNECTIONS:-500}
      - HTTP_MAX_KEEPALIVE=${HTTP_MAX_KEEPALIVE:-100}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-300}
      - PROXY_READ_TIMEOUT=${PROXY_READ_TIMEOUT:-600}

    volumes:
      - ${LOG_HOST_DIR:-./api-logger/logs}:/app/logs

    networks:
      - ${DOCKER_NETWORK:-newapi-net}

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

networks:
  newapi-net:
    name: ${DOCKER_NETWORK:-newapi-net}
    external: true
