# ============================================================
# Nginx 配置修改指南
#
# 端口体系（参考）：
#   newapi 对外      : 55000
#   api-logger 代理  : 8100 (内部，不对外)
#   多 vllm          : 55001 / 55002 / 55003
#   bge / rerank     : 55006
#   通义-Z-imate     : 54001
#
# 只需修改 upstream 块，将 api-logger:8100 设为主节点，
# newapi:55000 设为 backup（日志宕机时自动切直连）
# ============================================================

# ===== 修改前 =====
# upstream newapi_backend {
#     server newapi:55000;
# }

# ===== 修改后 =====
upstream newapi_backend {
    # 主节点：日志代理（在线时走这里记录日志）
    server api-logger:8100 max_fails=3 fail_timeout=30s;

    # 备用节点：直连 newapi（日志服务宕机时自动启用）
    server newapi:55000 backup;

    # 长连接池
    keepalive 128;
    keepalive_timeout 60s;
    keepalive_requests 2000;
}

# ===== 完整 server 块参考 =====
server {
    listen 80;
    server_name your-domain-or-ip;

    # 客户端请求体大小限制
    client_max_body_size 200m;

    # 代理超时设置
    proxy_read_timeout 600s;       # 流式响应 + 思考过程可能很久
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    # 通用代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # !! 关键：关闭缓冲才能正常转发流式响应 (SSE) !!
    proxy_buffering off;
    proxy_request_buffering off;

    # 增加缓冲区大小（处理大 body）
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://newapi_backend;

        # 跨域（如果需要）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
