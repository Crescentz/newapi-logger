# ============================================================
# newapi-logger docker-compose.yml
# 独立编排，不影响原有服务
#
# 使用方法:
#   cp deploy/.env.example deploy/.env && vi deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d
# ============================================================
version: "3.8"

services:
  api-logger:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: api-logger:latest
    container_name: api-logger
    restart: unless-stopped

    ports:
      - "${LISTEN_PORT:-8100}:8100"

    environment:
      - NEWAPI_URL=${NEWAPI_URL:-http://newapi:55000}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-newapi_logs}
      # newapi 使用 SQLite，挂载其 data 目录读取令牌信息
      - NEWAPI_SQLITE_PATH=${NEWAPI_SQLITE_PATH:-/newapi-data/one-api.db}
      - TOKEN_NAME_CACHE_TTL=${TOKEN_NAME_CACHE_TTL:-300}
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=8100
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - TOKEN_MASK=${TOKEN_MASK:-false}
      - DB_WORKER_THREADS=${DB_WORKER_THREADS:-3}
      - HTTP_MAX_CONNECTIONS=${HTTP_MAX_CONNECTIONS:-500}

    volumes:
      # 日志文件
      - ${LOG_HOST_DIR:-./logs}:/app/logs
      # newapi 的 data 目录（只读），用于读取 SQLite 令牌数据库
      - ${NEWAPI_DATA_DIR:-/opt/newapi/data}:/newapi-data:ro

    networks:
      - ${DOCKER_NETWORK:-newapi-net}

    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

    # 资源限制: 内存 32GB / CPU 4核（根据 128GB 服务器调整）
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "32G"
        reservations:
          cpus: "2"
          memory: "8G"

networks:
  newapi-net:
    name: ${DOCKER_NETWORK:-newapi-net}
    external: true
