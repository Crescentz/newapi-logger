# ============================================================
# Nginx 配置修改指南
#
# 端口体系：
#   Nginx 对外入口     : 55010
#   api-logger 代理    : 55020 (内部)
#   newapi             : 55000
#   多 vllm            : 55001 / 55002 / 55003
#   bge / rerank       : 55006
#   通义-Z-imate       : 54001
#
# 透明代理不影响任何请求内容：URL、Header、Body（含文件/图片）完全透传
# ============================================================

upstream newapi_backend {
    # 主节点：日志代理（在线时走这里记录日志）
    server api-logger:55020 max_fails=3 fail_timeout=30s;

    # 备用节点：直连 newapi（日志服务宕机时自动启用）
    server newapi:55000 backup;

    keepalive 128;
    keepalive_timeout 60s;
    keepalive_requests 2000;
}

server {
    listen 55010;
    server_name _;

    client_max_body_size 200m;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # !! 关键：关闭缓冲才能正常转发流式响应 (SSE) !!
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://newapi_backend;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
