# ============================================================
# newapi-logger 离线部署 docker-compose.yml
# 无需网络，直接 docker compose up -d 即可运行
#
# ═══════════════════════════════════════════════════════════
#  前置条件:
#   1. 已导入 Docker 镜像: docker load -i python-3.11-slim.tar
#                          docker load -i api-logger-v2.2.tar
#   2. 已初始化 MySQL 数据库: mysql -u root -p < schema.sql
#   3. 已配置 .env 文件: cp .env.example .env && vi .env
#
# ═══════════════════════════════════════════════════════════
#  可修改的端口 (在 .env 中修改, 然后 docker compose restart):
# ═══════════════════════════════════════════════════════════
#  LISTEN_PORT        → api-logger 宿主机端口 (默认 55020)
#  MYSQL_PORT         → MySQL 容器内端口 (默认 3306)
#  NEWAPI_PORT        → newapi 端口 (默认 55000)
#
# ═══════════════════════════════════════════════════════════
#  可修改的挂载路径 (在 .env 中修改):
# ═══════════════════════════════════════════════════════════
#  LOG_HOST_DIR       → 日志文件存放路径 (默认 ./logs)
#  NEWAPI_DATA_DIR    → newapi data 目录路径 (默认 /opt/newapi/data)
# ============================================================
version: "3.8"

services:
  api-logger:
    image: api-logger:latest
    container_name: api-logger
    restart: unless-stopped

    # ---- 端口 ----
    # 修改: .env 中改 LISTEN_PORT
    # 同时需同步修改 Nginx upstream 中的 server api-logger:端口
    ports:
      - "${LISTEN_PORT:-55020}:${LISTEN_PORT:-55020}"

    environment:
      # --- newapi 后端 ---
      - NEWAPI_URL=${NEWAPI_URL:-http://newapi:55000}
      - NEWAPI_HOST=${NEWAPI_HOST:-newapi}
      - NEWAPI_PORT=${NEWAPI_PORT:-55000}

      # --- 本服务监听 (修改后需同步改 ports 和 Nginx) ---
      - LISTEN_HOST=${LISTEN_HOST:-0.0.0.0}
      - LISTEN_PORT=${LISTEN_PORT:-55020}

      # --- MySQL 连接 (必须修改 MYSQL_PASSWORD) ---
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-newapi_logs}

      # --- newapi SQLite 令牌解析 (可选) ---
      - NEWAPI_SQLITE_PATH=${NEWAPI_SQLITE_PATH:-/newapi-data/one-api.db}
      - TOKEN_NAME_CACHE_TTL=${TOKEN_NAME_CACHE_TTL:-300}

      # --- 日志 ---
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs

      # --- 性能参数 ---
      - DB_WORKER_THREADS=${DB_WORKER_THREADS:-3}
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-2}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-8}
      - DB_QUEUE_MAXSIZE=${DB_QUEUE_MAXSIZE:-10000}
      - HTTP_MAX_CONNECTIONS=${HTTP_MAX_CONNECTIONS:-500}
      - HTTP_MAX_KEEPALIVE=${HTTP_MAX_KEEPALIVE:-100}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-300}
      - HTTP_CONNECT_TIMEOUT=${HTTP_CONNECT_TIMEOUT:-10}
      - PROXY_READ_TIMEOUT=${PROXY_READ_TIMEOUT:-600}

      # --- 流式内存控制 ---
      - MAX_STREAM_BUFFER_SIZE=${MAX_STREAM_BUFFER_SIZE:-10485760}

      # --- 安全 ---
      - TOKEN_MASK=${TOKEN_MASK:-false}

      # --- 文件日志 ---
      - FULL_LOG_MAX_MB=${FULL_LOG_MAX_MB:-100}
      - FULL_LOG_BACKUPS=${FULL_LOG_BACKUPS:-30}
      - ERROR_LOG_MAX_MB=${ERROR_LOG_MAX_MB:-50}
      - ERROR_LOG_BACKUPS=${ERROR_LOG_BACKUPS:-10}

    volumes:
      # ① 日志持久化 (修改: .env 中 LOG_HOST_DIR)
      - ${LOG_HOST_DIR:-./logs}:/app/logs

      # ② newapi SQLite 只读挂载 (修改: .env 中 NEWAPI_DATA_DIR)
      - ${NEWAPI_DATA_DIR:-/opt/newapi/data}:/newapi-data:ro

    networks:
      - ${DOCKER_NETWORK:-newapi-net}

    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "32G"
        reservations:
          cpus: "2"
          memory: "8G"

networks:
  newapi-net:
    name: ${DOCKER_NETWORK:-newapi-net}
    external: true
